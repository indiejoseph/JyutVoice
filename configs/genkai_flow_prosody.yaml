# Flow-Matching Duration Predictor + 50 Hz Frame-Level Prosody CFM with ModernCantoneseBert-large (add_blank: false)
n_feats: 80
n_heads: 4
p_dropout: 0.1
filter_channels_dp: 256
token_frame_rate: 25
token_mel_ratio: 2
chunk_size: 25
num_decoding_left_chunks: -1
kernel_size: 3
hidden_channels: 256
filter_channels: 1024

sample_rate: 24000
hop_length: 480
win_length: 1920
n_fft: 1920
f_min: 0
f_max: 8000
add_blank: false # Dropping blanks lets phones own their true durations
bert_dim: 1024 # ModernCantoneseBert-large (1024-d)
spk_embed_dim: 192
lang_embed_dim: 32

tts: !new:jyutvoice.models.jyutvoice_tts.JyutVoiceTTS
  encoder: !new:jyutvoice.models.text_encoder.TextEncoder
    encoder_type: RoPE Encoder
    encoder_params: !new:omegaconf.DictConfig
      content:
        n_feats: !ref <n_feats>
        n_channels: 192
        filter_channels: 768
        filter_channels_dp: !ref <filter_channels_dp>
        n_heads: 2
        n_layers: 6
        kernel_size: 3
        p_dropout: !ref <p_dropout>
        gin_channels: !ref <spk_embed_dim>
        prenet: true
    n_vocab: 97
    n_lang: 4 # Pad + Cantonese, Mandarin, English
    n_tone: 11 # pad + 6 Cantonese tones + 4 English stress ids
    bert_dim: !ref <bert_dim>

  dp: !new:jyutvoice.models.flow_duration_predictor.FlowDurationPredictor
    in_channels: 192
    filter_channels: !ref <filter_channels_dp>
    n_layers: 4
    kernel_size: 5
    p_dropout: !ref <p_dropout>
    bert_dim: !ref <bert_dim>
    spk_embed_dim: !ref <spk_embed_dim>
    cfg_dropout: 0.15
    grad_scale: 0.1

  prosody_cfm: !new:jyutvoice.models.prosody_cfm.ProsodyCFM
    in_channels: 80
    text_channels: 192
    hidden_channels: 256
    n_blocks: 6
    kernel_size: 7
    p_dropout: !ref <p_dropout>
    spk_embed_dim: !ref <spk_embed_dim>
    cfg_dropout: 0.15

  decoder: null
  spk_embed_dim: !ref <spk_embed_dim>
  optimizer: !name:torch.optim.AdamW
    lr: 2e-4
    weight_decay: 0.0
  scheduler: null
  warmup_steps: 500

data: !new:jyutvoice.data.text_mel_datamodule.TextMelDataModule
  name: jyutvoice_tts
  dataset_path: tmp/dataset_processed
  batch_size: 16
  num_workers: 4
  pin_memory: true
  dataset_valid_ratio: 0.005
  seed: 42
  load_durations: false
  add_blank: !ref <add_blank>
  n_fft: !ref <n_fft>
  n_feats: !ref <n_feats>
  sample_rate: !ref <sample_rate>
  hop_length: !ref <hop_length>
  win_length: !ref <win_length>
  f_min: !ref <f_min>
  f_max: !ref <f_max>
  max_duration: 30.0
  max_text_length: 500
  bert_dim: !ref <bert_dim>

trainer: !new:lightning.Trainer
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_epochs: 15
  detect_anomaly: false
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: checkpoints_flow_prosody
    filename: checkpoint_{epoch:03d}
    monitor: loss/val_epoch
    verbose: False
    save_last: true
    save_top_k: 5
    mode: "min"
    auto_insert_metric_name: True
    save_weights_only: False
    every_n_epochs: 1
