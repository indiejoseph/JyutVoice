# Defaults of scripts/export_onnx.py (every entry can be overridden on its command line).
# Exports the latest model: the English-capable encoder, its flow-matching duration sampler and the ProsodyCFM trained on its features.

# Training checkpoint with the encoder and the duration model (checkpoints/best/jyutvoice_flowdp_epoch019.ckpt is the Cantonese-only best)
checkpoint_path: "checkpoints_yue_en_flowdp/checkpoint_epoch=018.ckpt"

# The config that builds that model: configs/synth_flowdp.yaml for a flow-matching duration predictor, configs/base.yaml for a regression one
base_config: "configs/synth_flowdp.yaml"

# ProsodyCFM weights (scripts/train_prosody_cfm.py); null exports without it (checkpoints/best/prosody_cfm_mix1.pt is the one for the Cantonese-only best)
prosody_checkpoint: "/home/joseph/data_local/prosody/mix_en/prosody_cfm_best.pt"

output_dir: "onnx_models"
opset_version: 17

# Longest token sequence (blanks included) the text encoder graph accepts: its rotary position tables are baked into the graph up to this length (about 32 tokens
# per second of speech; the training data stops at 30 s, about 950 tokens)
max_tokens: 1024

# Euler steps unrolled into the duration sampler and ProsodyCFM graphs (the models were chosen with 10)
euler_steps: 10

# Largest accepted |onnx - torch| over every output of every graph (identical noise)
atol: 1.0e-3
